
services:
  migrate:
    build:
      context: ./backend/OnlineTesting.Api
    command: ["--migrate"]
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=online_testing;Username=app;Password=${DB_PASSWORD}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - testing-network

  api_a:
    build:
      context: ./backend/OnlineTesting.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      INSTANCE_ID: api-a
      Cache__RedisConnection: "redis:6379,abortConnect=false,connectTimeout=1000,syncTimeout=1000"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=online_testing;Username=app;Password=${DB_PASSWORD};Maximum Pool Size=20"
      ConnectionStrings__ReplicaConnection: "Host=db_replica;Port=5432;Database=online_testing;Username=app;Password=${DB_PASSWORD};Maximum Pool Size=20;Timeout=2;Command Timeout=3"
      ConnectionStrings__ShardAConnection: "Host=db;Port=5432;Database=online_testing;Username=app;Password=${DB_PASSWORD};Maximum Pool Size=20"
      ConnectionStrings__ShardBConnection: "Host=db_shard_b;Port=5432;Database=online_testing;Username=app;Password=${DB_PASSWORD};Maximum Pool Size=20"
    depends_on:
      migrate:
        condition: service_completed_successfully
      lab7_init:
        condition: service_completed_successfully
    networks:
      - testing-network

  api_b:
    build:
      context: ./backend/OnlineTesting.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      INSTANCE_ID: api-b
      Cache__RedisConnection: "redis:6379,abortConnect=false,connectTimeout=1000,syncTimeout=1000"
      LAB3_DELAY_MS: ${LAB3_DELAY_MS:-0}
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=online_testing;Username=app;Password=${DB_PASSWORD};Maximum Pool Size=20"
      ConnectionStrings__ReplicaConnection: "Host=db_replica;Port=5432;Database=online_testing;Username=app;Password=${DB_PASSWORD};Maximum Pool Size=20;Timeout=2;Command Timeout=3"
      ConnectionStrings__ShardAConnection: "Host=db;Port=5432;Database=online_testing;Username=app;Password=${DB_PASSWORD};Maximum Pool Size=20"
      ConnectionStrings__ShardBConnection: "Host=db_shard_b;Port=5432;Database=online_testing;Username=app;Password=${DB_PASSWORD};Maximum Pool Size=20"
    depends_on:
      migrate:
        condition: service_completed_successfully
      lab7_init:
        condition: service_completed_successfully
    networks:
      - testing-network

  api_c:
    build:
      context: ./backend/OnlineTesting.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      INSTANCE_ID: api-c
      Cache__RedisConnection: "redis:6379,abortConnect=false,connectTimeout=1000,syncTimeout=1000"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=online_testing;Username=app;Password=${DB_PASSWORD};Maximum Pool Size=20"
      ConnectionStrings__ReplicaConnection: "Host=db_replica;Port=5432;Database=online_testing;Username=app;Password=${DB_PASSWORD};Maximum Pool Size=20;Timeout=2;Command Timeout=3"
      ConnectionStrings__ShardAConnection: "Host=db;Port=5432;Database=online_testing;Username=app;Password=${DB_PASSWORD};Maximum Pool Size=20"
      ConnectionStrings__ShardBConnection: "Host=db_shard_b;Port=5432;Database=online_testing;Username=app;Password=${DB_PASSWORD};Maximum Pool Size=20"
    depends_on:
      migrate:
        condition: service_completed_successfully
      lab7_init:
        condition: service_completed_successfully
    networks:
      - testing-network

  db:
    image: postgres:17
    restart: unless-stopped
    command: ["postgres", "-c", "wal_level=replica", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10", "-c", "hot_standby=on"]
    environment:
      POSTGRES_DB: online_testing
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/primary-setup.sh:/replication/primary-setup.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d online_testing"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - testing-network

  db_replica:
    image: postgres:17
    restart: unless-stopped
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    entrypoint: ["/bin/bash", "/replication/replica-entrypoint.sh"]
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./scripts/replica-entrypoint.sh:/replication/replica-entrypoint.sh:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d online_testing && test \"$(psql -U app -d online_testing -Atc 'SHOW in_hot_standby')\" = on"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - testing-network

  db_shard_b:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: online_testing
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_shard_b_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d online_testing"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - testing-network

  lab7_init:
    image: postgres:17
    entrypoint: ["/bin/bash", "/lab7/lab7-init.sh"]
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./scripts/lab7-init.sh:/lab7/lab7-init.sh:ro
    depends_on:
      db:
        condition: service_healthy
      db_shard_b:
        condition: service_healthy
    networks:
      - testing-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - testing-network

  frontend:
    build:
      context: ./frontend
    ports:
      - "${LAB3_PUBLIC_PORT:-8081}:80"
    depends_on:
      - api_a
      - api_b
      - api_c
    networks:
      - testing-network

networks:
  testing-network:

volumes:
  postgres_data:
  postgres_replica_data:
  postgres_shard_b_data:
