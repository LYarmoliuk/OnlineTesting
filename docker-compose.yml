
services:
  migrate:
    build:
      context: ./backend/OnlineTesting.Api
    command: ["--migrate"]
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=online_testing;Username=app;Password=${DB_PASSWORD}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - testing-network

  api_a:
    build:
      context: ./backend/OnlineTesting.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      INSTANCE_ID: api-a
      Cache__RedisConnection: "redis:6379,abortConnect=false,connectTimeout=1000,syncTimeout=1000"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=online_testing;Username=app;Password=${DB_PASSWORD};Maximum Pool Size=20"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - testing-network

  api_b:
    build:
      context: ./backend/OnlineTesting.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      INSTANCE_ID: api-b
      Cache__RedisConnection: "redis:6379,abortConnect=false,connectTimeout=1000,syncTimeout=1000"
      LAB3_DELAY_MS: ${LAB3_DELAY_MS:-0}
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=online_testing;Username=app;Password=${DB_PASSWORD};Maximum Pool Size=20"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - testing-network

  api_c:
    build:
      context: ./backend/OnlineTesting.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      INSTANCE_ID: api-c
      Cache__RedisConnection: "redis:6379,abortConnect=false,connectTimeout=1000,syncTimeout=1000"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=online_testing;Username=app;Password=${DB_PASSWORD};Maximum Pool Size=20"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - testing-network

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: online_testing
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d online_testing"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - testing-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - testing-network

  frontend:
    build:
      context: ./frontend
    ports:
      - "${LAB3_PUBLIC_PORT:-8081}:80"
    depends_on:
      - api_a
      - api_b
      - api_c
    networks:
      - testing-network

networks:
  testing-network:

volumes:
  postgres_data:
