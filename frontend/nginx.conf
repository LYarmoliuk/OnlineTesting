
upstream backend_api {
    zone backend_api 64k;
    resolver 127.0.0.11 valid=2s;
    server api_a:8080 resolve max_fails=1 fail_timeout=3s;
    server api_b:8080 resolve max_fails=1 fail_timeout=3s;
    server api_c:8080 resolve max_fails=1 fail_timeout=3s;
    keepalive 128;
}

upstream backend_api_single {
    zone backend_api_single 64k;
    resolver 127.0.0.11 valid=2s;
    server api_a:8080 resolve;
    keepalive 128;
}

server {
    listen 80;
    server_name localhost;
    resolver 127.0.0.11 valid=2s;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        add_header X-Lab3-Algorithm round-robin always;
        set $lab5_upstream backend_api;
        if ($http_x_lab5_single_node = '1') {
            set $lab5_upstream backend_api_single;
        }
        proxy_pass http://$lab5_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health {
        add_header X-Lab3-Algorithm round-robin always;
        proxy_pass http://backend_api/health;
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }
}
